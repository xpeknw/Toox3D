[project]
name = "toox3d"
version = "0.1.0"
description = "Toox 3D backend foundation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.116.0,<0.117.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.35.0,<0.36.0",
]

[project.optional-dependencies]
hunyuan-v1 = [
    "accelerate>=0.33.0",
    "diffusers>=0.30.0,<0.36",
    "huggingface_hub==0.34.4",
    "einops",
    "numpy<2.1",
    "omegaconf",
    "onnxruntime>=1.22.1,<1.23.0",
    "opencv-python-headless",
    "pillow",
    "pybind11",
    "pygltflib",
    "pymeshlab",
    "rembg",
    "safetensors",
    "tqdm",
    "trimesh>=4.4.0",
    "transformers>=4.44.0,<5",
    "torch>=2.5.0,<2.9.0",
    "torchvision>=0.20.0,<0.24.0",
    "xatlas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
