services:
  toox3d-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toox3d-api
    ports:
      - "${TOOX_PORT:-8011}:${TOOX_PORT:-8011}"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./models:/app/models
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; port=os.environ.get('TOOX_PORT', '8011'); urllib.request.urlopen(f'http://127.0.0.1:{port}/health').read()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
